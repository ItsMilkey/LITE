name: Keep Service Alive

on:
  schedule:
    - cron: '*/14 * * * *' # Ejecutar cada 14 minutos (Render se duerme a los 15 min)
  workflow_dispatch: # Permite activarlo manualmente desde la UI de GitHub si es necesario

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend to Prevent Scaling Down
        # Hacemos una petición HEAD (-I) a la raíz para despertar el servicio sin descargar contenido.
        # La raíz sigue siendo pública y no está versionada; por eso no se usa /api/v1 aquí.
        run: curl -I https://lite-backend-1wn9.onrender.com/
