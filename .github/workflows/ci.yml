name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un push nuevo cancela la ejecución anterior de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests H2 (${{ matrix.timezone }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # El contrato de fechas debe ser idéntico en una zona UTC y en una
        # desplazada (Asia/Tokyo), no solo en la del desarrollador.
        timezone: [UTC, Asia/Tokyo]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # El wrapper está versionado sin bit de ejecución (repo creado en Windows).
      - name: Preparar wrapper
        run: chmod +x mvnw

      - name: Suite de tests
        run: ./mvnw -B -ntp test "-Dtest.timezone=${{ matrix.timezone }}"

  migraciones:
    name: Flyway + Hibernate validate (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Preparar wrapper
        run: chmod +x mvnw

      # Levanta un PostgreSQL 16 efímero, aplica V1..V12 con Flyway y deja que
      # Hibernate valide las entidades (ddl-auto=validate). Este job habría
      # fallado con el desajuste de PK de V9/V11 que llegó a producción.
      # El perfil -Ppostgres vuelve a incluir el test, excluido de `mvn test`
      # para que la suite local no exija Docker.
      - name: Aplicar migraciones y validar esquema real
        run: ./mvnw -B -ntp test -Ppostgres -Dtest=MigracionesPostgresTest
