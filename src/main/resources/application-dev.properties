# --- Configuración de la Base de Datos Oracle ---
# Estos valores ahora son leídos por nuestra clase DataSourceConfig.
spring.datasource.username=lite
spring.datasource.password=RixarLlama2006ColoColoXD
spring.datasource.url=jdbc:oracle:thin:@base3_high?TNS_ADMIN=G:/LITE_BACK/saveup/src/main/resources/wallet

# --- Configuración de JPA y Hibernate ---
# 'validate': Hibernate solo valida que el esquema coincida con las entidades.
# Flyway es el responsable de crear y evolucionar las tablas (V1, V2, ...).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway (Oracle - Desarrollo) ---
# Scripts específicos de Oracle en db/migration/oracle/
spring.flyway.locations=classpath:db/migration/oracle
# baseline-on-migrate: si la BD ya existe (creada por Hibernate),
# Flyway la marca en V0 y aplica V1, V2 ... de forma idempotente.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# --- Configuración de Logs para Depuración ---
# Muestra información detallada sobre las consultas SQL, conexiones y transacciones.
# Muy útil para depurar errores de base de datos.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.springframework.jdbc.core=TRACE
logging.level.com.zaxxer.hikari=DEBUG


# --- Configuración de CORS para Desarrollo ---
# Permite que tu aplicación frontend (Android, Ionic, etc.) que corre en un origen diferente
# (ej. localhost) pueda comunicarse con el backend.
app.cors.allowed-origins=http://localhost:8100,http://localhost:4200,capacitor://localhost,http://localhost
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With
app.cors.allow-credentials=true
app.cors.max-age=3600
