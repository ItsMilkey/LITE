# Nombre de la aplicación
spring.application.name=SaveUp

# --- Contrato de fechas y dinero (T8a) ---
# Instantes (java.util.Date) en ISO-8601 UTC con sufijo Z; las fechas de
# calendario (LocalDate) se serializan como yyyy-MM-dd. La zona del negocio
# (America/Santiago) es una constante de FechasMovimiento, no una propiedad.
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
# Persistencia de instantes en UTC, independiente de la zona de la JVM/sesión SQL.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Puerto en el que correrá el servidor del backend
server.port=8080

# --- Perfil Activo ---
# Activa el perfil "dev". Spring Boot buscará y cargará automáticamente
# el archivo "application-dev.properties" para la configuración específica.
spring.profiles.active=prod

# Clave secreta para JWT (JSON Web Tokens) - Guárdala de forma segura
# Puedes mover esto al perfil 'dev' si tienes claves diferentes por entorno.
jwt.secret=${JWT_SECRET}
jwt.expirationInMs=86400000 
# 24 horas en milisegundos