# Nombre de la aplicación
spring.application.name=SaveUp

# --- Contrato de fechas y dinero (T8a) ---
# Instantes (java.util.Date) en ISO-8601 UTC con sufijo Z; las fechas de
# calendario (LocalDate) se serializan como yyyy-MM-dd. La zona del negocio
# (America/Santiago) es una constante de FechasMovimiento, no una propiedad.
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
# Persistencia de instantes en UTC, independiente de la zona de la JVM/sesión SQL.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Puerto en el que correrá el servidor del backend
server.port=8080

# --- Perfil Activo ---
# Activa el perfil "dev". Spring Boot buscará y cargará automáticamente
# el archivo "application-dev.properties" para la configuración específica.
spring.profiles.active=prod

# Clave secreta para JWT (JSON Web Tokens) - Guárdala de forma segura
# Puedes mover esto al perfil 'dev' si tienes claves diferentes por entorno.
jwt.secret=${JWT_SECRET}
# --- T9.1: access token corto ---
# 15 minutos: se renueva en silencio con POST /api/v1/auth/refresh usando el
# refresh token rotativo (90 días). Así un token filtrado tiene ventana corta.
jwt.expirationInMs=900000

# --- T9.3: correo para recuperar contraseña ---
# true: loguea el correo (incluido el token) en la consola; no necesita SMTP.
# false: envía de verdad vía JavaMailSender; exige spring.mail.* configurado
# (se activa en application-prod.properties antes de publicar).
app.mail.log-only=true
# Cuando esté lista la app pública, apunta aquí la pantalla de restablecimiento:
# el correo conversará "abre: <url><token>". Vacío = solo el token en el texto.
app.mail.url-restablecer=

# --- T9.4: versión mínima de la app (forzar actualización) ---
# SemVer MAJOR.MINOR.PATCH por plataforma. Por debajo de min-* la app está
# bloqueada (actualización obligatoria); entre min-* y latest-* se sugiere
# actualizar. Al publicar cada release sube latest-*; min-* solo cuando el
# backend cambia algo que obliga a salir de la app (contrato, seguridad...).
app.version.min-android=1.0.0
app.version.latest-android=1.0.0
app.version.min-ios=1.0.0
app.version.latest-ios=1.0.0
# Enlace de la tienda según plataforma, para el botón "Actualizar" de la app.
app.version.url-tienda-android=https://play.google.com/store/apps/details?id=cl.saveup.lite
app.version.url-tienda-ios=https://apps.apple.com/app/saveup-lite
# Versión (número simple) de los documentos legales vigentes que la app refleja.
app.version.terminos=1
app.version.privacidad=1