# -------------------------------------------------------------------
# ================ PERFIL DE PRODUCCIÓN (prod) ======================
# -------------------------------------------------------------------

# --- Configuración de la Base de Datos PostgreSQL (Render) ---
# Le decimos a Spring que use el driver de PostgreSQL.
spring.datasource.driver-class-name=org.postgresql.Driver

# Le decimos a JPA que use el dialecto de PostgreSQL para generar SQL correcto.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 'validate' es la opción más segura para producción.
# Comprueba que las tablas de la BD coincidan con las entidades, pero no hace cambios.
# Para el PRIMER despliegue, podría ser necesario cambiarlo a 'update' temporalmente
# para que Hibernate cree las tablas automáticamente.
spring.jpa.hibernate.ddl-auto=update

# --- Configuración leída desde variables de entorno de Render ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
jwt.secret=${JWT_SECRET}