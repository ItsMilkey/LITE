    # Le decimos a Spring que use el driver de PostgreSQL
    spring.datasource.driver-class-name=org.postgresql.Driver

    # Le decimos a JPA que use el dialecto de PostgreSQL para generar SQL correcto.
    spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

    # No queremos que Hibernate elimine y cree las tablas cada vez.
    # 'validate' verifica que las tablas coincidan con las entidades, lo cual es más seguro.
    spring.jpa.hibernate.ddl-auto=validate

    # --- Configuración leída desde variables de entorno de Render ---
    spring.datasource.url=${SPRING_DATASOURCE_URL}
    spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
    spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
    jwt.secret=${JWT_SECRET}