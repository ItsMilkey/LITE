# -------------------------------------------------------------------
# ================ PERFIL DE PRODUCCIÓN (prod) ======================
# -------------------------------------------------------------------

# --- Configuración de JPA y Hibernate para Oracle ---
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# --- ¡MUY IMPORTANTE! ---
# Para el PRIMER despliegue, usa "create" para que Hibernate construya las tablas.
spring.jpa.hibernate.ddl-auto=create
# Para despliegues POSTERIORES, cambia a "validate" o "update"
# para no borrar los datos.
# spring.jpa.hibernate.ddl-auto=validate

# --- Configuración leída desde variables de entorno de Render ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
jwt.secret=${JWT_SECRET}

# --- Configuración de CORS para Producción ---
app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With
app.cors.allow-credentials=false 
app.cors.max-age=3600