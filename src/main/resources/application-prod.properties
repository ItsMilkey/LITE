# -------------------------------------------------------------------
# ================ PERFIL DE PRODUCCIÓN (prod) ======================
# -------------------------------------------------------------------

# --- Configuración de JPA y Hibernate para PostgreSQL ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'none': Hibernate NO toca el esquema en absoluto en producción.
# Flyway es el único responsable de crear y migrar el esquema.
spring.jpa.hibernate.ddl-auto=none

# --- Flyway (PostgreSQL - Producción) ---
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# --- Configuración de conexión a Supabase PostgreSQL (Session Pooler) ---
# sslmode=require: Supabase exige conexiones cifradas SSL/TLS.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
jwt.secret=${JWT_SECRET}

# --- Correo (T9.3): PENDIENTE de activación ---
# app.mail.enabled=false (bandera maestra): el flujo de recuperación no genera
# ni envía nada; la app arranca sin credenciales SMTP. Se activa con la
# variable de entorno APP_MAIL_ENABLED=true cuando exista el proveedor.
# Preferir un proveedor con API HTTP: Render free puede bloquear el SMTP
# saliente. Antes de activar, definir APP_MAIL_ENABLED=true y, si se usa SMTP:
#   spring.mail.host=...
#   spring.mail.port=587
#   spring.mail.username=...
#   spring.mail.password=... (secreto)
#   spring.mail.properties.mail.smtp.auth=true
#   spring.mail.properties.mail.smtp.starttls.enable=true
# app.mail.log-only=false ya está fijado para producción: con la bandera
# activa y sin host, el envío falla de forma ruidosa (ERROR_INTERNO) en vez de
# simular un envío que nunca ocurrió.
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.log-only=false

# --- Push (T9.6): recordatorios de cuota — PENDIENTE de activación ---
# app.push.enabled=false (bandera maestra): ejecutar(...) es no-op total (no
# envía y NO persiste RECORDATORIO_ENVIADO); la app arranca sin credenciales
# de Firebase. Se activa con APP_PUSH_ENABLED=true solo cuando existan el
# proyecto Firebase + credenciales, la app móvil registrando tokens y el
# disparador externo (cron contra el endpoint con PUSH_CRON_SECRET).
app.push.enabled=${APP_PUSH_ENABLED:false}
# Mientras no exista el service account de Firebase, dejar log-only=true (valor
# heredado de application.properties): el job corre y loguea, sin enviar.
# Al publicar: app.push.log-only=false y definir FIREBASE_CREDENTIALS (JSON
# base64 del service account). Además, definir PUSH_CRON_SECRET y programar un
# cron externo contra POST /api/v1/notificaciones/recordatorios/ejecutar: en
# Render free la instancia duerme y el @Scheduled interno no es confiable.
# app.push.log-only=false

# --- Configuración de CORS para Producción ---
app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With
app.cors.allow-credentials=false 
app.cors.max-age=3600

# --- OpenAPI (T8c): el contrato vive en docs/openapi.json, no se expone en producción ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
