spring.application.name=SaveUpTest
spring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# --- Contrato de fechas (T8a) ---
# Se replican las claves de src/main/resources/application.properties porque
# este archivo lo sombrea en el classpath de tests.
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

jwt.secret=mi_clave_secreta_super_segura_para_jwt_123456
jwt.expirationInMs=86400000

# --- T9.3: el reset de contraseña se loguea en consola en tests ---
app.mail.log-only=true
app.mail.url-restablecer=

# --- T9.4: umbrales de versión con min < latest para poder probar los tres
# estados (obligatoria < 2.0.0, sugerida entre 2.0.0 y 2.4.0, al día >= 2.4.0).
# En producción (application.properties) min y latest parten iguales en 1.0.0.
app.version.min-android=2.0.0
app.version.latest-android=2.4.0
app.version.min-ios=2.0.0
app.version.latest-ios=2.4.0
app.version.url-tienda-android=https://play.google.com/store/apps/details?id=cl.saveup.lite
app.version.url-tienda-ios=https://apps.apple.com/app/saveup-lite
app.version.terminos=1
app.version.privacidad=1

# --- T9.6: push, sin FCM ni scheduling real en tests ---
# habilitado=false evita que el @Scheduled se dispare durante la suite;
# los tests del servicio llaman a ejecutar() directamente.
app.push.habilitado=false
app.push.log-only=true
app.push.dias-antes=3
app.push.cron-secret=secreto-de-test
